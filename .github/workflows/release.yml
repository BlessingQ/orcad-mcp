name: Release

# Push a tag "vX.Y.Z" (matching the version in pyproject.toml) to publish to PyPI and create a GitHub release.
# PyPI needs a trusted publisher for this repository: https://docs.pypi.org/trusted-publishers/
#   owner BlessingQ, repository orcad-mcp, workflow release.yml, environment pypi

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: windows-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check tag matches version
        shell: bash
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv build
      - run: uv publish --trusted-publishing always
      - name: GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md"
