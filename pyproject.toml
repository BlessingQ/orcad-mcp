[project]
name = "orcad-mcp"
version = "0.1.0"
description = "MCP server for OrCAD Capture: read and edit schematics (parts, pins, nets, properties, BOM, PADS netlist) from an AI assistant"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "IONTEC" }]
requires-python = ">=3.11"
keywords = ["mcp", "orcad", "capture", "cadence", "schematic", "eda", "netlist", "bom", "pads"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Tcl",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "mcp>=2.3,<3",
]

[project.urls]
Homepage = "https://github.com/BlessingQ/orcad-mcp"
Repository = "https://github.com/BlessingQ/orcad-mcp"
Issues = "https://github.com/BlessingQ/orcad-mcp/issues"
Changelog = "https://github.com/BlessingQ/orcad-mcp/blob/main/CHANGELOG.md"

[project.scripts]
orcad-mcp = "orcad_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orcad_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "README.ko.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.uv]
# rebuild cached `uvx --from <path>` installs whenever the sources change, not only pyproject.toml
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }, { file = "src/**/*.tcl" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["capture: needs a running OrCAD Capture with the orcad-mcp bridge (deselected by default)"]
addopts = "-m 'not capture'"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
